name: Build Food Valley IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate iOS project
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Find Xcode workspace and scheme
        run: |
          WORKSPACE=$(find ios -maxdepth 1 -name "*.xcworkspace" -print -quit)

          if [ -z "$WORKSPACE" ]; then
            echo "No Xcode workspace found."
            exit 1
          fi

          SCHEME=$(xcodebuild \
            -workspace "$WORKSPACE" \
            -list \
            -json | python3 -c 'import json,sys; print(json.load(sys.stdin)["workspace"]["schemes"][0])')

          echo "WORKSPACE=$WORKSPACE" >> "$GITHUB_ENV"
          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"

          echo "Workspace: $WORKSPACE"
          echo "Scheme: $SCHEME"

      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Create unsigned IPA
        run: |
          echo "Searching for built iOS app..."

          find "$PWD/build" -type d -name "*.app" -print

          APP_PATH=$(find "$PWD/build" -type d -name "*.app" -print -quit)

          if [ -z "$APP_PATH" ]; then
            echo "No .app file was found anywhere inside the build directory."
            exit 1
          fi

          echo "Found app at: $APP_PATH"

          rm -rf Payload
          rm -f Food-Valley.ipa

          mkdir Payload
          cp -R "$APP_PATH" Payload/

          /usr/bin/zip -qry Food-Valley.ipa Payload

          echo "IPA created successfully:"
          ls -lh Food-Valley.ipa

      - name: Upload Food Valley IPA
        uses: actions/upload-artifact@v4
        with:
          name: Food-Valley-iOS
          path: Food-Valley.ipa