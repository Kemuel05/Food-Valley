name: Build Food Valley IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate iOS project
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Find Food Valley Xcode scheme
        run: |
          WORKSPACE=$(find ios -maxdepth 1 -name "*.xcworkspace" -print -quit)

          if [ -z "$WORKSPACE" ]; then
            echo "No Xcode workspace found."
            exit 1
          fi

          echo "Workspace found:"
          echo "$WORKSPACE"

          echo "Available non-Pods shared schemes:"
          find ios \
            -path "*/xcshareddata/xcschemes/*.xcscheme" \
            -not -path "*/Pods/*" \
            -print

          SCHEME_FILE=$(find ios \
            -path "*/xcshareddata/xcschemes/*.xcscheme" \
            -not -path "*/Pods/*" \
            -print \
            -quit)

          if [ -z "$SCHEME_FILE" ]; then
            echo "No application scheme file found."
            exit 1
          fi

          SCHEME=$(basename "$SCHEME_FILE" .xcscheme)

          echo "Using application scheme:"
          echo "$SCHEME"

          echo "WORKSPACE=$WORKSPACE" >> "$GITHUB_ENV"
          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"

      - name: Build unsigned Food Valley app
        run: |
          echo "Building scheme: $SCHEME"

          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Locate built application
        run: |
          echo "Build products:"
          find "$PWD/build/Build/Products" -maxdepth 3 -print || true

          APP_PATH=$(find "$PWD/build/Build/Products" \
            -type d \
            -name "*.app" \
            -print \
            -quit)

          if [ -z "$APP_PATH" ]; then
            echo "No .app was generated."
            exit 1
          fi

          echo "Found application:"
          echo "$APP_PATH"

          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Create unsigned IPA
        run: |
          rm -rf Payload
          rm -f Food-Valley.ipa

          mkdir Payload
          cp -R "$APP_PATH" Payload/

          /usr/bin/zip -qry Food-Valley.ipa Payload

          echo "IPA created:"
          ls -lh Food-Valley.ipa

      - name: Upload Food Valley IPA
        uses: actions/upload-artifact@v4
        with:
          name: Food-Valley-iOS
          path: Food-Valley.ipa